<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">No-overturn regularization and soft-unit CE</title>
  <desc id="desc">Two panels showing the no-overturn regularizer on grid samples and the soft-unit cross-entropy over the global carve.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="vol" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.52" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#15803d"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 18px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 16px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .small { font: 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .mono { font: 18px Consolas, Menlo, monospace; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#page)"/>
  <text x="70" y="58" class="title">Regularization and global classification</text>
  <text x="70" y="91" class="subtitle">The local CSet constraints keep fields and surfaces plausible; CE calibrates the final unit labels.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="125" width="510" height="555" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="620" y="125" width="510" height="555" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <!-- overturn -->
  <g>
    <text x="100" y="165" class="panel-title">overturn: no-overturn regularizer</text>
    <text x="100" y="195" class="small">At Poisson-grid samples, gradients should have a</text>
    <text x="100" y="215" class="small">non-negative younging component.</text>
    <rect x="100" y="235" width="450" height="300" rx="14" fill="url(#vol)" stroke="#e2e8f0"/>
    <path d="M100 330 C190 292 274 302 355 342 C430 380 485 360 550 326" fill="none" stroke="#0284c7" stroke-width="5" opacity="0.7"/>
    <path d="M100 420 C190 386 274 394 355 430 C430 463 488 452 550 420" fill="none" stroke="#16a34a" stroke-width="5" opacity="0.7"/>
    <path d="M100 505 C190 478 280 484 360 512 C430 536 490 522 550 496" fill="none" stroke="#b45309" stroke-width="5" opacity="0.7"/>
    <line x1="148" y1="515" x2="148" y2="292" stroke="#334155" stroke-width="4" marker-end="url(#arrowSlate)"/>
    <text x="160" y="302" class="label">younging direction</text>
    <g stroke-width="4" stroke-linecap="round">
      <line x1="260" y1="455" x2="260" y2="402" stroke="#15803d" marker-end="url(#arrowGreen)"/>
      <line x1="360" y1="480" x2="360" y2="425" stroke="#15803d" marker-end="url(#arrowGreen)"/>
      <line x1="460" y1="410" x2="460" y2="455" stroke="#b91c1c" marker-end="url(#arrowRed)"/>
      <line x1="320" y1="340" x2="320" y2="292" stroke="#15803d" marker-end="url(#arrowGreen)"/>
      <line x1="505" y1="315" x2="505" y2="355" stroke="#b91c1c" marker-end="url(#arrowRed)"/>
    </g>
    <g fill="#0f172a">
      <circle cx="260" cy="455" r="4"/><circle cx="360" cy="480" r="4"/><circle cx="460" cy="410" r="4"/><circle cx="320" cy="340" r="4"/><circle cx="505" cy="315" r="4"/>
    </g>
    <text x="286" y="395" class="small" fill="#15803d">ok</text>
    <text x="468" y="474" class="small" fill="#b91c1c">penalize</text>
    <rect x="120" y="560" width="405" height="78" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="140" y="592" class="mono">grad f . younging_dir &gt;= 0</text>
    <text x="140" y="620" class="small">Keeps fields monotone between sparse contact and unit data.</text>
  </g>

  <!-- CE -->
  <g>
    <text x="650" y="165" class="panel-title">CE: soft-unit NLL context</text>
    <text x="650" y="195" class="small">Not a CSet constraint, but the global class loss</text>
    <text x="650" y="215" class="small">that the other constraints support.</text>
    <rect x="650" y="235" width="450" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <path d="M650 235 L1100 235 L1100 535 L650 535 Z" fill="#fff7ed"/>
    <path d="M650 320 C735 292 825 305 900 338 C982 374 1042 355 1100 330 L1100 235 L650 235 Z" fill="#dbeafe"/>
    <path d="M650 320 C735 292 825 305 900 338 C982 374 1042 355 1100 330" fill="none" stroke="#0369a1" stroke-width="5"/>
    <path d="M650 432 C736 402 824 418 904 454 C982 489 1044 466 1100 438" fill="none" stroke="#ea580c" stroke-width="5"/>
    <path d="M650 432 C736 402 824 418 904 454 C982 489 1044 466 1100 438 L1100 535 L650 535 Z" fill="#fef3c7"/>
    <path d="M650 320 C735 292 825 305 900 338 C982 374 1042 355 1100 330 L1100 438 C1044 466 982 489 904 454 C824 418 736 402 650 432 Z" fill="#dcfce7" opacity="0.8"/>
    <g fill="#0369a1">
      <circle cx="720" cy="270" r="6"/><circle cx="820" cy="286" r="6"/><circle cx="990" cy="300" r="6"/>
    </g>
    <g fill="#15803d">
      <circle cx="720" cy="374" r="6"/><circle cx="840" cy="382" r="6"/><circle cx="980" cy="408" r="6"/>
    </g>
    <g fill="#b45309">
      <circle cx="720" cy="486" r="6"/><circle cx="835" cy="475" r="6"/><circle cx="990" cy="500" r="6"/>
    </g>
    <rect x="925" y="260" width="140" height="95" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#cbd5e1"/>
    <text x="942" y="286" class="small">soft carve</text>
    <rect x="945" y="302" width="85" height="12" rx="3" fill="#0369a1" opacity="0.8"/>
    <rect x="945" y="320" width="55" height="12" rx="3" fill="#16a34a" opacity="0.8"/>
    <rect x="945" y="338" width="26" height="12" rx="3" fill="#b45309" opacity="0.8"/>
    <line x1="910" y1="362" x2="940" y2="318" stroke="#334155" stroke-width="3" marker-end="url(#arrowSlate)"/>
    <rect x="670" y="560" width="405" height="78" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="690" y="592" class="mono">NLL(log P(unit), true level)</text>
    <text x="690" y="620" class="small">Classifies unit points after the seeded stick-break carve.</text>
  </g>

  <text x="70" y="720" class="small">CE explains why some class-owning package constraints are partly redundant; surface and unconformity constraints remain load-bearing.</text>
</svg>
