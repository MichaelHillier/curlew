<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Depositional package constraints</title>
  <desc id="desc">Three point-indexed panels showing interface equality, within-package unit-band inequality, and within-package interface inequality constraints.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="youngBand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="middleBand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="oldBand" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 18px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 15px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .small { font: 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .tiny { font: 12px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .eq { font: 18px Consolas, Menlo, monospace; fill: #0f172a; }
      .point-label { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#page)"/>
  <text x="70" y="58" class="title">Depositional package constraints</text>
  <text x="70" y="91" class="subtitle">The loss draws indexed point examples from each pool; the equations show what each sampled pair enforces.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="125" width="330" height="690" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="435" y="125" width="330" height="690" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="800" y="125" width="330" height="690" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <!-- eq panel -->
  <g>
    <text x="95" y="165" class="panel-title">eq: interface trace</text>
    <text x="95" y="195" class="small">Sample pairs from the same contact</text>
    <text x="95" y="215" class="small">must have the same scalar value.</text>

    <rect x="95" y="250" width="280" height="315" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <path d="M95 418 C150 372 222 383 284 419 C326 444 352 444 375 426 L375 565 L95 565 Z" fill="url(#oldBand)"/>
    <path d="M95 250 L375 250 L375 426 C352 444 326 444 284 419 C222 383 150 372 95 418 Z" fill="url(#youngBand)"/>
    <path d="M95 418 C150 372 222 383 284 419 C326 444 352 444 375 426" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>

    <g fill="#0369a1">
      <circle cx="132" cy="400" r="7"/>
      <circle cx="176" cy="387" r="7"/>
      <circle cx="221" cy="395" r="7"/>
      <circle cx="276" cy="415" r="7"/>
      <circle cx="330" cy="438" r="7"/>
    </g>
    <text x="115" y="383" class="point-label">p₁</text>
    <text x="174" y="371" class="point-label">p₂</text>
    <text x="221" y="379" class="point-label">p₃</text>
    <text x="279" y="399" class="point-label">p₄</text>
    <text x="333" y="423" class="point-label">p₅</text>

    <line x1="132" y1="400" x2="176" y2="387" stroke="#0369a1" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="221" y1="395" x2="330" y2="438" stroke="#0369a1" stroke-width="2" stroke-dasharray="5 5"/>

    <rect x="112" y="590" width="246" height="116" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="132" y="621" class="label">example residuals</text>
    <text x="132" y="651" class="eq">f(p₁) - f(p₂) ≈ 0</text>
    <text x="132" y="681" class="eq">f(p₃) - f(p₅) ≈ 0</text>
    <text x="112" y="742" class="tiny">Grad-normalised, so the field cannot satisfy this by</text>
    <text x="112" y="760" class="tiny">shrinking its scalar range.</text>
  </g>

  <!-- #1 panel -->
  <g>
    <text x="460" y="165" class="panel-title">#1: unit-band iq</text>
    <text x="460" y="195" class="small">Draw one point from the younger band</text>
    <text x="460" y="215" class="small">pool and one from the older band pool.</text>

    <rect x="460" y="250" width="280" height="315" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <path d="M460 250 L740 250 L740 360 C650 332 560 340 460 360 Z" fill="url(#youngBand)"/>
    <path d="M460 360 C560 340 650 332 740 360 L740 470 C655 445 560 450 460 475 Z" fill="url(#middleBand)"/>
    <path d="M460 475 C560 450 655 445 740 470 L740 565 L460 565 Z" fill="url(#oldBand)"/>
    <path d="M460 360 C560 340 650 332 740 360" fill="none" stroke="#0369a1" stroke-width="4"/>
    <path d="M460 475 C560 450 655 445 740 470" fill="none" stroke="#b45309" stroke-width="4"/>

    <g fill="#0369a1">
      <circle cx="505" cy="302" r="6"/>
      <circle cx="565" cy="318" r="6"/>
      <circle cx="630" cy="306" r="6"/>
      <circle cx="700" cy="324" r="6"/>
    </g>
    <g fill="#15803d">
      <circle cx="505" cy="414" r="6"/>
      <circle cx="575" cy="398" r="6"/>
      <circle cx="640" cy="414" r="6"/>
      <circle cx="704" cy="435" r="6"/>
    </g>
    <g fill="#b45309">
      <circle cx="520" cy="520" r="6"/>
      <circle cx="588" cy="505" r="6"/>
      <circle cx="660" cy="512" r="6"/>
      <circle cx="710" cy="533" r="6"/>
    </g>

    <text x="489" y="286" class="point-label">y₁</text>
    <text x="555" y="302" class="point-label">y₂</text>
    <text x="629" y="290" class="point-label">y₃</text>
    <text x="493" y="402" class="point-label">m₁</text>
    <text x="633" y="402" class="point-label">m₂</text>
    <text x="510" y="545" class="point-label">o₁</text>
    <text x="650" y="538" class="point-label">o₂</text>

    <line x1="565" y1="318" x2="575" y2="398" stroke="#15803d" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="630" y1="306" x2="660" y2="512" stroke="#15803d" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="488" y="255" class="label" fill="#0369a1">younger pool</text>
    <text x="488" y="554" class="label" fill="#92400e">older pool</text>

    <rect x="477" y="590" width="246" height="116" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="497" y="621" class="label">example iq pairs</text>
    <text x="497" y="651" class="eq">f(y₂) - f(m₁) &gt; 0</text>
    <text x="497" y="681" class="eq">f(y₃) - f(o₂) &gt; 0</text>
    <text x="477" y="742" class="tiny">The actual draw is random over the two point pools;</text>
    <text x="477" y="760" class="tiny">only violated pairs add hinge loss.</text>
  </g>

  <!-- #2 panel -->
  <g>
    <text x="825" y="165" class="panel-title">#2: interface iq</text>
    <text x="825" y="195" class="small">The same pair rule, but the pools are</text>
    <text x="825" y="215" class="small">points on two seeded contact traces.</text>

    <rect x="825" y="250" width="280" height="315" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <path d="M825 250 L1105 250 L1105 565 L825 565 Z" fill="#fff7ed"/>
    <path d="M825 330 C910 305 1015 323 1105 298" fill="none" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <path d="M825 448 C915 420 1010 444 1105 405" fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
    <path d="M825 330 C910 305 1015 323 1105 298 L1105 405 C1010 444 915 420 825 448 Z" fill="#dcfce7" opacity="0.66"/>

    <g fill="#0369a1">
      <circle cx="885" cy="318" r="7"/>
      <circle cx="970" cy="318" r="7"/>
      <circle cx="1045" cy="312" r="7"/>
    </g>
    <g fill="#ea580c">
      <circle cx="890" cy="435" r="7"/>
      <circle cx="970" cy="436" r="7"/>
      <circle cx="1040" cy="431" r="7"/>
    </g>
    <text x="868" y="302" class="point-label">c₁</text>
    <text x="970" y="303" class="point-label">c₂</text>
    <text x="1048" y="297" class="point-label">c₃</text>
    <text x="872" y="461" class="point-label">d₁</text>
    <text x="970" y="462" class="point-label">d₂</text>
    <text x="1043" y="456" class="point-label">d₃</text>
    <line x1="970" y1="318" x2="970" y2="436" stroke="#b45309" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="1045" y1="312" x2="1040" y2="431" stroke="#b45309" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="846" y="304" class="label" fill="#0369a1">younger contact</text>
    <text x="846" y="487" class="label" fill="#b45309">next older contact</text>

    <rect x="842" y="590" width="246" height="116" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="862" y="621" class="label">example contact pairs</text>
    <text x="862" y="651" class="eq">f(c₂) - f(d₂) &gt; 0</text>
    <text x="862" y="681" class="eq">f(c₃) - f(d₃) &gt; 0</text>
    <text x="842" y="742" class="tiny">These traces have eq losses, but no class labels;</text>
    <text x="842" y="760" class="tiny">this prevents contacts from crossing.</text>
  </g>

  <text x="70" y="855" class="small">For `eq`, pairs come from one interface trace. For `iq`, pairs come from two different pools, and the first pool must evaluate higher.</text>
</svg>
