<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">defaultDomain='child' &#8212; erosional truncation (cut step)</title>
  <desc id="desc">A cross-section showing defaultDomain child: the child event's own scalar-field isosurface is an erosional surface that bevels older tilted beds during the cut/truncation step.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="cutClaim1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="cutClaim2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#cffafe" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="cutClaim3" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dbeafe" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="olderWarm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="76" y="120" width="1048" height="505" rx="18"/>
    </clipPath>
    <clipPath id="olderClip">
      <path d="M80 426 C210 402 330 370 460 364 C595 358 690 318 830 301 C960 286 1034 264 1120 250 L1120 625 L80 625 Z"/>
    </clipPath>
    <clipPath id="cutClaimClip">
      <path d="M80 120 L1120 120 L1120 250 C1034 264 960 286 830 301 C690 318 595 358 460 364 C330 370 210 402 80 426 Z"/>
    </clipPath>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="80" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">defaultDomain='child' &#8212; erosional truncation (cut step)</text>
  <text x="80" y="91" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">The child event's own scalar field defines the cut mask; it is not the final younger package.</text>

  <g filter="url(#softShadow)">
    <rect x="76" y="120" width="1048" height="505" rx="18" fill="url(#sky)" stroke="#cbd5e1"/>
  </g>

  <g clip-path="url(#panelClip)">
    <rect x="76" y="120" width="1048" height="505" fill="url(#sky)"/>

    <g clip-path="url(#olderClip)">
      <rect x="76" y="120" width="1048" height="505" fill="url(#olderWarm)"/>
      <path d="M-130 264 C72 296 236 331 420 376 C610 423 786 480 982 532 C1114 567 1212 598 1326 640" fill="none" stroke="#7dd3fc" stroke-width="48" opacity="0.92"/>
      <path d="M-130 329 C70 359 236 395 420 439 C610 486 786 542 982 594 C1114 629 1210 660 1326 702" fill="none" stroke="#c4b5fd" stroke-width="49" opacity="0.9"/>
      <path d="M-130 392 C70 424 236 458 420 503 C610 549 786 606 982 658 C1114 693 1212 724 1326 766" fill="none" stroke="#fde68a" stroke-width="49" opacity="0.94"/>
      <path d="M-130 456 C72 488 238 523 420 566 C610 612 786 670 982 722 C1114 757 1210 788 1326 830" fill="none" stroke="#86efac" stroke-width="50" opacity="0.9"/>
      <path d="M-130 520 C72 552 238 586 420 631 C610 676 786 733 982 786 C1114 821 1210 852 1326 894" fill="none" stroke="#fca5a5" stroke-width="51" opacity="0.82"/>
      <path d="M-130 300 C72 331 236 367 420 411 C610 458 786 514 982 567 C1114 602 1212 633 1326 675" fill="none" stroke="#0369a1" stroke-width="9" opacity="0.44"/>
      <path d="M-130 363 C72 395 236 430 420 475 C610 521 786 578 982 630 C1114 666 1212 696 1326 739" fill="none" stroke="#7c3aed" stroke-width="9" opacity="0.4"/>
      <path d="M-130 427 C72 459 236 494 420 539 C610 585 786 642 982 694 C1114 730 1212 760 1326 803" fill="none" stroke="#b45309" stroke-width="9" opacity="0.43"/>
      <path d="M-130 491 C72 523 236 558 420 602 C610 649 786 706 982 758 C1114 793 1212 824 1326 867" fill="none" stroke="#047857" stroke-width="9" opacity="0.42"/>
    </g>

    <g clip-path="url(#cutClaimClip)">
      <path d="M80 426 C210 402 330 370 460 364 C595 358 690 318 830 301 C960 286 1034 264 1120 250 L1120 195 C1034 209 960 231 830 246 C690 263 595 303 460 309 C330 315 210 347 80 371 Z" fill="url(#cutClaim1)"/>
      <path d="M80 371 C210 347 330 315 460 309 C595 303 690 263 830 246 C960 231 1034 209 1120 195 L1120 125 C1034 139 960 161 830 176 C690 193 595 233 460 239 C330 245 210 277 80 301 Z" fill="url(#cutClaim2)"/>
      <path d="M80 301 C210 277 330 245 460 239 C595 233 690 193 830 176 C960 161 1034 139 1120 125 L1120 -60 C1034 -46 960 -24 830 -9 C690 8 595 48 460 54 C330 60 210 92 80 116 Z" fill="url(#cutClaim3)"/>
      <path d="M80 371 C210 347 330 315 460 309 C595 303 690 263 830 246 C960 231 1034 209 1120 195" fill="none" stroke="#0f766e" stroke-width="7" opacity="0.58" stroke-linecap="round"/>
      <path d="M80 301 C210 277 330 245 460 239 C595 233 690 193 830 176 C960 161 1034 139 1120 125" fill="none" stroke="#0369a1" stroke-width="7" opacity="0.48" stroke-linecap="round"/>
    </g>

    <path d="M80 426 C210 402 330 370 460 364 C595 358 690 318 830 301 C960 286 1034 264 1120 250" fill="none" stroke="#991b1b" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 426 C210 402 330 370 460 364 C595 358 690 318 830 301 C960 286 1034 264 1120 250" fill="none" stroke="#fee2e2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="92" y="144" width="410" height="132" rx="12" fill="#ffffff" fill-opacity="0.94" stroke="#fecaca"/>
    <text x="112" y="176" font-size="18" font-weight="700" fill="#991b1b">Domain source</text>
    <text x="112" y="207" font-size="24" font-family="Consolas, Menlo, monospace" fill="#0f172a">domain = child.scalar</text>
    <text x="112" y="236" font-size="16" fill="#475569">This event's own field supplies the iso;</text>
    <text x="112" y="258" font-size="16" fill="#475569">the cut mask uses this event's own field.</text>

    <rect x="716" y="142" width="386" height="144" rx="12" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1"/>
    <text x="736" y="174" font-size="18" font-weight="700" fill="#334155">Overprint test</text>
    <text x="736" y="204" font-size="21" font-family="Consolas, Menlo, monospace" fill="#0f172a">mask = (f_child &gt; theta)</text>
    <text x="736" y="232" font-size="16" fill="#475569">Above: older rock is removed.</text>
    <text x="736" y="254" font-size="16" fill="#475569">Below: older rock is kept.</text>
    <text x="736" y="276" font-size="16" fill="#475569">Owns no lithology; it only truncates.</text>

    <text x="902" y="416" font-size="19" font-weight="700" fill="#991b1b">unconformity =</text>
    <text x="902" y="442" font-size="19" font-weight="700" fill="#991b1b">this event's OWN iso</text>
    <text x="902" y="468" font-size="16" fill="#475569">(f_child = theta), a surface only</text>
    <line x1="892" y1="424" x2="920" y2="293" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrowRed)"/>

    <text x="138" y="539" font-size="19" font-weight="700" fill="#334155">older beds</text>
    <text x="138" y="566" font-size="16" fill="#475569">beveled / truncated at the cut</text>
    <line x1="331" y1="529" x2="449" y2="366" stroke="#334155" stroke-width="3" marker-end="url(#arrowSlate)"/>

    <rect x="486" y="286" width="438" height="112" rx="12" fill="#ffffff" fill-opacity="0.88" stroke="#99f6e4"/>
    <text x="506" y="314" font-size="18" font-weight="700" fill="#0f766e">the unconformity's OWN field</text>
    <text x="506" y="340" font-size="16" fill="#475569">claims this above its iso (&#8776;parallel to the cut)</text>
    <text x="506" y="362" font-size="16" fill="#475569">&#8212; the cut/truncation step</text>
    <text x="506" y="384" font-size="16" fill="#475569">not the younger package</text>
    <line x1="496" y1="305" x2="455" y2="332" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowTeal)"/>

    <rect x="102" y="292" width="354" height="112" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#bae6fd"/>
    <text x="122" y="322" font-size="18" font-weight="700" fill="#0369a1">parent step replaces this</text>
    <text x="122" y="350" font-size="16" fill="#475569">the younger package baselaps onto the cut</text>
    <text x="122" y="372" font-size="16" fill="#475569">and is not generally parallel</text>
    <text x="122" y="394" font-size="16" fill="#475569">(see the parent panel)</text>
    <line x1="420" y1="382" x2="496" y2="342" stroke="#0369a1" stroke-width="3" marker-end="url(#arrowTeal)"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="80" y="658" width="1040" height="1" fill="#cbd5e1"/>
    <text x="80" y="682" font-size="15" fill="#475569">Use for an eroded unit's cut step: the unconformity's own field claims above its iso and removes older rock.</text>
    <text x="80" y="706" font-size="15" fill="#475569">The unconformity owns no rock; the final younger package is handled in the parent step.</text>
  </g>
</svg>
