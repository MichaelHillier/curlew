<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Child-domain erosional truncation</title>
  <desc id="desc">A cross-section showing defaultDomain child: the child event's own scalar-field isosurface defines the erosion boundary that truncates older parent beds.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="claim" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fee2e2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fca5a5" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="claimHatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#ef4444" stroke-width="3" opacity="0.18"/>
    </pattern>
    <clipPath id="panelClip">
      <rect x="76" y="120" width="1048" height="505" rx="18"/>
    </clipPath>
    <clipPath id="olderClip">
      <path d="M80 344 C225 258 340 277 458 344 C596 423 675 278 810 278 C938 278 1006 343 1120 298 L1120 625 L80 625 Z"/>
    </clipPath>
    <clipPath id="childClaimClip">
      <path d="M80 120 L1120 120 L1120 298 C1006 343 938 278 810 278 C675 278 596 423 458 344 C340 277 225 258 80 344 Z"/>
    </clipPath>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="80" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">defaultDomain='child': erosional truncation</text>
  <text x="80" y="91" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">The overprint mask is evaluated on this event's own scalar field.</text>

  <g filter="url(#softShadow)">
    <rect x="76" y="120" width="1048" height="505" rx="18" fill="url(#sky)" stroke="#cbd5e1"/>
  </g>

  <g clip-path="url(#panelClip)">
    <rect x="76" y="120" width="1048" height="505" fill="url(#sky)"/>
    <g clip-path="url(#olderClip)">
      <rect x="76" y="120" width="1048" height="505" fill="#fbf0d9"/>
      <path d="M-80 590 C125 526 290 534 470 579 C652 625 806 558 980 583 C1102 601 1190 568 1280 541" fill="none" stroke="#7dd3fc" stroke-width="42" opacity="0.94"/>
      <path d="M-100 530 C92 474 260 477 445 528 C620 576 780 520 955 537 C1095 550 1185 520 1275 493" fill="none" stroke="#86efac" stroke-width="40" opacity="0.93"/>
      <path d="M-90 470 C96 425 266 421 438 466 C610 511 778 463 944 471 C1085 477 1178 458 1285 423" fill="none" stroke="#fde68a" stroke-width="40" opacity="0.95"/>
      <path d="M-80 410 C104 374 282 360 446 398 C608 435 766 399 934 391 C1060 385 1162 374 1270 342" fill="none" stroke="#c4b5fd" stroke-width="39" opacity="0.9"/>
      <path d="M-90 640 C115 586 290 596 470 642 C653 689 814 627 984 652 C1106 670 1192 642 1280 616" fill="none" stroke="#fca5a5" stroke-width="42" opacity="0.82"/>
      <path d="M-80 350 C118 315 292 300 462 333 C620 363 754 344 924 332 C1048 323 1164 322 1275 292" fill="none" stroke="#38bdf8" stroke-width="13" opacity="0.55"/>
      <path d="M-80 438 C112 394 283 386 449 430 C611 472 775 430 941 431 C1082 430 1177 413 1281 383" fill="none" stroke="#059669" stroke-width="11" opacity="0.55"/>
      <path d="M-80 505 C109 450 277 451 450 499 C619 545 779 492 949 506 C1089 518 1185 491 1272 464" fill="none" stroke="#b45309" stroke-width="10" opacity="0.45"/>
      <path d="M-70 570 C130 507 294 515 472 558 C651 603 807 538 979 562 C1101 579 1192 550 1274 523" fill="none" stroke="#0369a1" stroke-width="10" opacity="0.45"/>
    </g>

    <g clip-path="url(#childClaimClip)">
      <rect x="76" y="120" width="1048" height="505" fill="url(#claim)"/>
      <rect x="76" y="120" width="1048" height="505" fill="url(#claimHatch)"/>
    </g>

    <path d="M80 344 C225 258 340 277 458 344 C596 423 675 278 810 278 C938 278 1006 343 1120 298" fill="none" stroke="#991b1b" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 344 C225 258 340 277 458 344 C596 423 675 278 810 278 C938 278 1006 343 1120 298" fill="none" stroke="#fee2e2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="92" y="144" width="336" height="112" rx="12" fill="#ffffff" fill-opacity="0.94" stroke="#fecaca"/>
    <text x="112" y="176" font-size="18" font-weight="700" fill="#991b1b">Domain source</text>
    <text x="112" y="207" font-size="24" font-family="Consolas, Menlo, monospace" fill="#0f172a">domain = child.scalar</text>
    <text x="112" y="236" font-size="16" fill="#475569">This event's own field supplies the iso.</text>

    <rect x="760" y="142" width="328" height="118" rx="12" fill="#ffffff" fill-opacity="0.94" stroke="#cbd5e1"/>
    <text x="780" y="174" font-size="18" font-weight="700" fill="#334155">Overprint test</text>
    <text x="780" y="204" font-size="21" font-family="Consolas, Menlo, monospace" fill="#0f172a">w = 1 if f_child &gt; theta</text>
    <text x="780" y="233" font-size="16" fill="#475569">Above the child iso, the child event replaces older rock.</text>

    <text x="782" y="358" font-size="19" font-weight="700" fill="#991b1b">CHILD field iso</text>
    <line x1="774" y1="365" x2="705" y2="304" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrowRed)"/>

    <text x="168" y="553" font-size="19" font-weight="700" fill="#334155">Older parent beds</text>
    <text x="168" y="580" font-size="16" fill="#475569">truncated by the child surface</text>
    <line x1="350" y1="541" x2="458" y2="430" stroke="#334155" stroke-width="3" marker-end="url(#arrowSlate)"/>

    <text x="586" y="480" font-size="18" font-weight="700" fill="#991b1b">claimed by the child event</text>
    <text x="586" y="506" font-size="16" fill="#475569">the red mask is computed from the child field</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="80" y="658" width="1040" height="1" fill="#cbd5e1"/>
    <text x="80" y="691" font-size="16" fill="#475569">Use for an erosional unconformity: the new unconformity event owns the boundary geometry that cuts older geology.</text>
  </g>
</svg>
