<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Erosional ordering inequality</title>
  <desc id="desc">A cross-section showing the onlapping package point pool ordered above the eroded unit and every older unit level, one inequality pair per older level.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="young" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="eroded" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="old1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="old2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="1" stop-color="#fecaca"/>
    </linearGradient>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0369a1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 18px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 16px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .small { font: 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .mono { font: 18px Consolas, Menlo, monospace; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#page)"/>
  <text x="70" y="58" class="title">#5: erosional ordering iq</text>
  <text x="70" y="91" class="subtitle">The onlapping package is ordered above the eroded unit and every older unit level in the unconformity field.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="125" width="1060" height="515" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <rect x="100" y="170" width="700" height="395" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <path d="M100 170 L800 170 L800 284 C704 318 610 293 514 310 C414 328 335 390 235 380 C178 374 137 348 100 338 Z" fill="url(#young)" opacity="0.95"/>
  <path d="M100 338 C137 348 178 374 235 380 C335 390 414 328 514 310 C610 293 704 318 800 284 L800 395 C696 425 596 402 500 420 C398 438 322 475 220 468 C170 464 132 445 100 430 Z" fill="url(#eroded)"/>
  <path d="M100 430 C132 445 170 464 220 468 C322 475 398 438 500 420 C596 402 696 425 800 395 L800 485 C690 510 592 492 500 505 C398 520 320 540 218 535 C165 532 130 520 100 505 Z" fill="url(#old1)"/>
  <path d="M100 505 C130 520 165 532 218 535 C320 540 398 520 500 505 C592 492 690 510 800 485 L800 565 L100 565 Z" fill="url(#old2)"/>
  <path d="M100 338 C137 348 178 374 235 380 C335 390 414 328 514 310 C610 293 704 318 800 284" fill="none" stroke="#b91c1c" stroke-width="8" stroke-linecap="round"/>
  <path d="M100 430 C132 445 170 464 220 468 C322 475 398 438 500 420 C596 402 696 425 800 395" fill="none" stroke="#15803d" stroke-width="4"/>
  <path d="M100 505 C130 520 165 532 218 535 C320 540 398 520 500 505 C592 492 690 510 800 485" fill="none" stroke="#b45309" stroke-width="4"/>

  <g fill="#0369a1">
    <circle cx="185" cy="260" r="6"/><circle cx="250" cy="296" r="6"/><circle cx="372" cy="292" r="6"/><circle cx="508" cy="258" r="6"/><circle cx="650" cy="260" r="6"/><circle cx="725" cy="235" r="6"/>
  </g>
  <g fill="#15803d">
    <circle cx="180" cy="405" r="6"/><circle cx="275" cy="435" r="6"/><circle cx="430" cy="396" r="6"/><circle cx="585" cy="368" r="6"/><circle cx="720" cy="372" r="6"/>
  </g>
  <g fill="#b45309">
    <circle cx="178" cy="485" r="6"/><circle cx="295" cy="502" r="6"/><circle cx="455" cy="474" r="6"/><circle cx="610" cy="458" r="6"/><circle cx="725" cy="468" r="6"/>
  </g>
  <g fill="#b91c1c">
    <circle cx="175" cy="542" r="6"/><circle cx="300" cy="548" r="6"/><circle cx="465" cy="538" r="6"/><circle cx="625" cy="524" r="6"/><circle cx="730" cy="522" r="6"/>
  </g>

  <text x="130" y="245" class="label" fill="#0369a1">above_pool: onlapping package points</text>
  <text x="130" y="412" class="label" fill="#15803d">eroded unit level</text>
  <text x="130" y="485" class="label" fill="#b45309">older unit level</text>
  <text x="130" y="548" class="label" fill="#b91c1c">oldest unit level</text>
  <text x="575" y="328" class="label" fill="#b91c1c">unconformity iso</text>

  <line x1="710" y1="245" x2="720" y2="368" stroke="#0369a1" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
  <line x1="650" y1="260" x2="610" y2="454" stroke="#0369a1" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>
  <line x1="508" y1="258" x2="465" y2="534" stroke="#0369a1" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/>

  <rect x="835" y="170" width="260" height="178" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="858" y="205" class="panel-title">Pair construction</text>
  <text x="858" y="242" class="mono">for each older level B:</text>
  <text x="858" y="277" class="mono">  above_pool &gt; B</text>
  <text x="858" y="312" class="small">One pair per older level gives</text>
  <text x="858" y="332" class="small">each deep anchor a full sample draw.</text>

  <rect x="835" y="375" width="260" height="190" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="858" y="410" class="panel-title">Geological effect</text>
  <text x="858" y="447" class="small">The field must place the</text>
  <text x="858" y="467" class="small">unconformity below the young</text>
  <text x="858" y="487" class="small">package and above all eroded</text>
  <text x="858" y="507" class="small">older rock, not only the unit</text>
  <text x="858" y="527" class="small">directly below the contact.</text>

  <text x="70" y="682" class="small">This is the key non-CE erosional constraint: the unconformity field owns no lithology class, so CE only influences it indirectly through the onlap weight.</text>
</svg>
