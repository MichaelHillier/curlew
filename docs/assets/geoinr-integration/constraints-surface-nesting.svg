<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Surface nesting constraints</title>
  <desc id="desc">Point-indexed diagrams for unconformity nesting and package-top nesting constraints, using dashed unconformities and solid conformable horizons.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 18px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 21px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .sub-title { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .label { font: 600 15px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .small { font: 14px Inter, Segoe UI, Arial, sans-serif; fill: #475569; }
      .tiny { font: 12px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .eq { font: 18px Consolas, Menlo, monospace; fill: #0f172a; }
      .point { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="980" fill="#f8fafc"/>
  <text x="70" y="58" class="title">Surface nesting constraints</text>
  <text x="70" y="91" class="subtitle">The geology is erosional/truncating; the loss itself is a sampled point-pair inequality.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="125" width="1060" height="360" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="70" y="525" width="1060" height="365" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>

  <!-- Legend -->
  <g>
    <rect x="832" y="145" width="268" height="86" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="854" y1="172" x2="925" y2="172" stroke="#111827" stroke-width="6" stroke-dasharray="18 12"/>
    <text x="942" y="178" class="small">younger unconformity Y</text>
    <line x1="854" y1="204" x2="925" y2="204" stroke="#dc2626" stroke-width="6" stroke-dasharray="18 12"/>
    <text x="942" y="210" class="small">older unconformity O</text>
  </g>

  <!-- #3 top panel -->
  <text x="100" y="165" class="panel-title">#3: unconformity nesting iq</text>
  <text x="100" y="196" class="small">A younger unconformity can truncate an older unconformity.</text>
  <text x="100" y="216" class="small">The iq loss samples points: older-surface points must evaluate below the younger iso in the younger field.</text>

  <!-- without constraint -->
  <g>
    <text x="100" y="246" class="sub-title">(a) without the nesting pair</text>
    <rect x="100" y="262" width="455" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M128 380 C205 360 295 368 355 330 C410 296 455 270 528 258" fill="none" stroke="#111827" stroke-width="6" stroke-dasharray="19 12" stroke-linecap="round"/>
    <path d="M128 292 C220 292 315 292 405 292 C465 292 504 292 528 292" fill="none" stroke="#dc2626" stroke-width="6" stroke-dasharray="19 12" stroke-linecap="round"/>
    <line x1="128" y1="292" x2="340" y2="292" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 5"/>
    <circle cx="250" cy="292" r="15" fill="#ef4444"/>
    <circle cx="430" cy="292" r="12" fill="#ef4444"/>
    <circle cx="402" cy="300" r="12" fill="#111827"/>
    <circle cx="482" cy="270" r="12" fill="#111827"/>
    <text x="244" y="267" class="point">o₁</text>
    <text x="424" y="267" class="point">o₂</text>
    <text x="396" y="280" class="point">y₁</text>
    <text x="476" y="286" class="point">y₂</text>
    <text x="148" y="330" class="tiny" fill="#dc2626">o₁ samples the wrong side of Y</text>
    <path d="M240 305 C238 325 243 342 258 352" fill="none" stroke="#334155" stroke-width="3"/>
    <text x="278" y="349" class="tiny">violating sample</text>
  </g>

  <!-- with constraint -->
  <g>
    <text x="625" y="246" class="sub-title">(b) with point-pair nesting</text>
    <rect x="625" y="262" width="455" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M653 390 C724 368 785 314 858 292 C925 272 1000 304 1054 258" fill="none" stroke="#111827" stroke-width="6" stroke-dasharray="19 12" stroke-linecap="round"/>
    <path d="M653 325 C744 325 840 325 930 325 C994 325 1032 325 1054 325" fill="none" stroke="#dc2626" stroke-width="6" stroke-dasharray="19 12" stroke-linecap="round"/>
    <line x1="653" y1="325" x2="830" y2="325" stroke="#dc2626" stroke-width="2" stroke-dasharray="3 5"/>
    <circle cx="760" cy="325" r="15" fill="#ef4444"/>
    <circle cx="910" cy="325" r="12" fill="#ef4444"/>
    <circle cx="858" cy="292" r="12" fill="#111827"/>
    <circle cx="1018" cy="286" r="12" fill="#111827"/>
    <text x="754" y="300" class="point">o₁</text>
    <text x="904" y="300" class="point">o₂</text>
    <text x="852" y="272" class="point">y₁</text>
    <text x="1012" y="276" class="point">y₂</text>
    <line x1="858" y1="292" x2="760" y2="325" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="1018" y1="286" x2="910" y2="325" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="680" y="368" class="tiny">Y still cuts O where the surfaces intersect</text>
  </g>

  <rect x="250" y="426" width="700" height="40" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="277" y="452" class="eq">sampled in younger field:   f<tspan dy="5" font-size="12">Y</tspan><tspan dy="-5">(y₁) - f</tspan><tspan dy="5" font-size="12">Y</tspan><tspan dy="-5">(o₁) &gt; 0,   f</tspan><tspan dy="5" font-size="12">Y</tspan><tspan dy="-5">(y₂) - f</tspan><tspan dy="5" font-size="12">Y</tspan><tspan dy="-5">(o₂) &gt; 0</tspan></text>

  <!-- #4 lower panel -->
  <text x="100" y="565" class="panel-title">#4: package-top nesting iq</text>
  <text x="100" y="596" class="small">Baselap stacking: lower-package horizons terminate on the red unconformity; the upper package terminates on both T and O.</text>

  <g>
    <rect x="100" y="620" width="635" height="235" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M105 735 C150 745 195 765 245 777 C330 793 410 807 480 823 C545 838 585 828 620 815 C655 801 685 787 720 778" fill="none" stroke="#dc2626" stroke-width="6" stroke-dasharray="18 12" stroke-linecap="round"/>

    <path d="M225 776 C300 755 375 740 455 725 C530 710 595 697 640 685 C665 678 690 670 710 665" fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <path d="M185 760 C210 750 230 746 250 740 C330 718 390 705 455 695 C530 684 585 670 635 655 C660 648 690 640 710 635" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/>

    <path d="M105 735 C175 675 285 650 410 642 C520 636 620 627 705 625" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 745 C215 705 290 682 365 668 C455 652 560 648 650 642 C675 640 695 638 710 635" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>

    <circle cx="250" cy="740" r="9" fill="#111827"/>
    <circle cx="455" cy="695" r="9" fill="#111827"/>
    <circle cx="635" cy="655" r="9" fill="#111827"/>
    <circle cx="245" cy="777" r="9" fill="#ef4444"/>
    <circle cx="480" cy="823" r="9" fill="#ef4444"/>
    <circle cx="620" cy="815" r="9" fill="#ef4444"/>
    <text x="244" y="724" class="point">t₁</text>
    <text x="449" y="679" class="point">t₂</text>
    <text x="629" y="639" class="point">t₃</text>
    <text x="239" y="802" class="point">o₁</text>
    <text x="474" y="845" class="point">o₂</text>
    <text x="614" y="839" class="point">o₃</text>
    <line x1="455" y1="695" x2="480" y2="823" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="635" y1="655" x2="620" y2="815" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"/>

    <text x="126" y="648" class="tiny" fill="#4b5563">upper package beds: endpoints touch O or T</text>
    <text x="250" y="632" class="label">T: lower package top contact</text>
    <text x="145" y="840" class="label" fill="#dc2626">O: older unconformity base</text>
  </g>

  <g>
    <rect x="770" y="650" width="330" height="170" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="792" y="682" class="label">evaluated in the lower package field</text>
    <text x="792" y="718" class="eq">f<tspan dy="5" font-size="12">pkg</tspan><tspan dy="-5">(t₂) - f</tspan><tspan dy="5" font-size="12">pkg</tspan><tspan dy="-5">(o₂) &gt; 0</tspan></text>
    <text x="792" y="750" class="eq">f<tspan dy="5" font-size="12">pkg</tspan><tspan dy="-5">(t₃) - f</tspan><tspan dy="5" font-size="12">pkg</tspan><tspan dy="-5">(o₃) &gt; 0</tspan></text>
    <text x="792" y="786" class="tiny">This keeps the onlap threshold above older</text>
    <text x="792" y="804" class="tiny">unconformity surfaces.</text>
  </g>

  <text x="70" y="935" class="small">Dashed red is the older unconformity. Solid black curves are lower-package conformable horizons; blue curves are upper-package horizons.</text>
</svg>
